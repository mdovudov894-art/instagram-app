<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-container">
            <div class="auth-logo">
                <i class="fa-solid fa-message"></i>
                <h1>ChatApp</h1>
            </div>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="showTab('login')">Войти</button>
                <button class="auth-tab" onclick="showTab('register')">Регистрация</button>
            </div>
            <div id="loginForm" class="auth-form">
                <input type="text" id="loginUsername" placeholder="Номи корбар" />
                <input type="password" id="loginPassword" placeholder="Парол" />
                <button onclick="login()">Войти</button>
                <p id="loginError" class="error-msg"></p>
            </div>
            <div id="registerForm" class="auth-form hidden">
                <input type="text" id="regUsername" placeholder="Номи корбар" />
                <input type="password" id="regPassword" placeholder="Парол (камаш 6 аломат)" />
                <button onclick="register()">Регистрация</button>
                <p id="registerError" class="error-msg"></p>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" class="main-app hidden">

        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span id="myUsername" class="my-username"></span>
                <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Ҷустуҷӯ..." oninput="searchUsers()" />
            </div>
            <div class="users-list" id="usersList"></div>
        </div>

        <!-- CHAT AREA -->
        <div class="chat-area" id="chatArea">
            <div class="chat-default" id="chatDefault">
                <i class="fa-solid fa-message"></i>
                <p>Корбореро интихоб кунед</p>
            </div>
            <div class="chat-screen hidden" id="chatScreen">
                <div class="chat-header">
                    <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="chat-header-info">
                        <div class="chat-avatar" id="chatAvatar"></div>
                        <span id="chatUsername"></span>
                    </div>
                </div>

                <div class="messages-container" id="messagesContainer"></div>

                <div class="message-input-area">
                    <div class="input-row">
                        <input type="text" id="messageInput" placeholder="Паём нависед..."
                               onkeypress="if(event.key==='Enter') sendMessage()" />
                        <button class="send-btn" onclick="sendMessage()">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                        <button class="voice-btn" id="voiceBtn" onclick="toggleRecording()">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>
                    <div class="recording-indicator hidden" id="recordingIndicator">
                        <div class="recording-dot"></div>
                        <span id="recordingTime">0:00</span>
                        <span>сабт мешавад...</span>
                        <button onclick="cancelRecording()">
                            <i class="fa-solid fa-trash"></i> Ҳазф
                        </button>
                        <button onclick="stopRecording()" style="color:#0095f6">
                            <i class="fa-solid fa-paper-plane"></i> Фиристед
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- REACTION PICKER -->
    <div class="reaction-picker hidden" id="reactionPicker">
        <span onclick="setReaction('❤️')">❤️</span>
        <span onclick="setReaction('😂')">😂</span>
        <span onclick="setReaction('😮')">😮</span>
        <span onclick="setReaction('😢')">😢</span>
        <span onclick="setReaction('😡')">😡</span>
        <span onclick="setReaction('👍')">👍</span>
        <span onclick="setReaction('👎')">👎</span>
        <span onclick="setReaction('🔥')">🔥</span>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
