<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — ChatApp</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.admin-header{background:#111;border-bottom:1px solid #222;padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
.admin-header h1{font-size:18px;font-weight:700;color:#00d4aa}
.admin-header .logout-btn{margin-left:auto;background:#f87171;border:none;color:#fff;padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;padding:24px}
.stat-card{background:#1a1a1a;border:1px solid #222;border-radius:14px;padding:18px;text-align:center}
.stat-card .num{font-size:32px;font-weight:700;color:#00d4aa}
.stat-card .label{font-size:12px;color:#888;margin-top:4px}
.section{padding:0 24px 24px}
.section h2{font-size:15px;font-weight:600;color:#e0e0e0;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.search-bar{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:8px 14px;color:#e0e0e0;font-size:14px;width:100%;max-width:320px;margin-bottom:16px;outline:none}
.search-bar:focus{border-color:#00d4aa}
table{width:100%;border-collapse:collapse;background:#1a1a1a;border-radius:14px;overflow:hidden;border:1px solid #222}
th{background:#111;padding:10px 14px;text-align:left;font-size:12px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
td{padding:10px 14px;border-top:1px solid #1e1e1e;font-size:13px;vertical-align:middle}
tr:hover td{background:#202020}
.avatar-sm{width:32px;height:32px;border-radius:50%;background:#00d4aa;display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-size:13px;overflow:hidden;flex-shrink:0}
.avatar-sm img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.role-badge{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
.role-admin{background:rgba(0,212,170,0.15);color:#00d4aa}
.role-user{background:rgba(255,255,255,0.06);color:#888}
.btn{border:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.15s}
.btn-del{background:#f87171;color:#fff}
.btn-del:hover{background:#ef4444}
.btn-role{background:#333;color:#e0e0e0}
.btn-role:hover{background:#444}
.btn-msgs{background:#2563eb;color:#fff}
.btn-msgs:hover{background:#1d4ed8}
.actions{display:flex;gap:6px}
.toast{position:fixed;bottom:24px;right:24px;background:#00d4aa;color:#000;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;display:none;z-index:100}
.login-overlay{position:fixed;inset:0;background:#0d0d0d;display:flex;align-items:center;justify-content:center;z-index:999}
.login-box{background:#1a1a1a;border:1px solid #333;border-radius:20px;padding:32px;width:320px}
.login-box h2{font-size:18px;margin-bottom:20px;color:#00d4aa;text-align:center}
.login-input{width:100%;background:#111;border:1px solid #333;border-radius:10px;padding:10px 14px;color:#e0e0e0;font-size:14px;outline:none;margin-bottom:12px}
.login-input:focus{border-color:#00d4aa}
.login-btn{width:100%;background:#00d4aa;border:none;color:#000;padding:11px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.err{color:#f87171;font-size:12px;margin-top:6px;text-align:center}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <h2><i class="fa-solid fa-shield-halved"></i> Admin Panel</h2>
        <input class="login-input" type="text" id="adminUser" placeholder="Номи корбар"/>
        <input class="login-input" type="password" id="adminPass" placeholder="Парол"/>
        <button class="login-btn" onclick="adminLogin()">Дохил шудан</button>
        <p class="err" id="loginErr"></p>
    </div>
</div>

<div id="mainPanel" style="display:none">
    <div class="admin-header">
        <i class="fa-solid fa-bolt" style="color:#00d4aa;font-size:20px"></i>
        <h1>ChatApp Admin</h1>
        <span id="adminName" style="color:#888;font-size:13px"></span>
        <button class="logout-btn" onclick="adminLogout()">Баромадан</button>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="num" id="st1">—</div><div class="label">Ҳамаи корбарон</div></div>
        <div class="stat-card"><div class="num" id="st2">—</div><div class="label">Ҳамаи паёмҳо</div></div>
        <div class="stat-card"><div class="num" id="st3">—</div><div class="label">Паёмҳои имрӯз</div></div>
        <div class="stat-card"><div class="num" id="st4">—</div><div class="label">Корбарони нав (имрӯз)</div></div>
    </div>

    <div class="section">
        <h2><i class="fa-solid fa-users"></i> Корбарон</h2>
        <input class="search-bar" type="text" placeholder="Ҷустуҷӯ..." oninput="filterUsers(this.value)"/>
        <table>
            <thead>
                <tr>
                    <th>Корбар</th>
                    <th>Нақш</th>
                    <th>Паёмҳо</th>
                    <th>Санаи қайд</th>
                    <th>Амалиёт</th>
                </tr>
            </thead>
            <tbody id="usersTable"></tbody>
        </table>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let adminToken = localStorage.getItem('adminToken');
let allUsers = [];

if (adminToken) tryAutoLogin();

async function adminLogin() {
    const u = document.getElementById('adminUser').value.trim();
    const p = document.getElementById('adminPass').value.trim();
    document.getElementById('loginErr').textContent = '';
    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (!res.ok) { document.getElementById('loginErr').textContent = data.message; return; }
        if (data.role !== 'admin') { document.getElementById('loginErr').textContent = 'Шумо admin нестед!'; return; }
        adminToken = data.token;
        localStorage.setItem('adminToken', adminToken);
        showPanel(data.username);
    } catch(e) { document.getElementById('loginErr').textContent = 'Хатогӣ!'; }
}

async function tryAutoLogin() {
    try {
        const res = await fetch('/api/auth/verify', { headers: { 'Authorization': 'Bearer ' + adminToken } });
        if (!res.ok) { adminToken = null; localStorage.removeItem('adminToken'); return; }
        const data = await res.json();
        if (data.role !== 'admin') { adminToken = null; localStorage.removeItem('adminToken'); return; }
        showPanel(data.username);
    } catch(e) {}
}

function showPanel(username) {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('mainPanel').style.display = 'block';
    document.getElementById('adminName').textContent = username;
    loadStats();
    loadUsers();
}

async function loadStats() {
    try {
        const res = await fetch('/api/admin/stats', { headers: { 'Authorization': 'Bearer ' + adminToken } });
        const d = await res.json();
        document.getElementById('st1').textContent = d.totalUsers;
        document.getElementById('st2').textContent = d.totalMessages;
        document.getElementById('st3').textContent = d.todayMessages;
        document.getElementById('st4').textContent = d.newUsers;
    } catch(e) {}
}

async function loadUsers() {
    try {
        const res = await fetch('/api/admin/users', { headers: { 'Authorization': 'Bearer ' + adminToken } });
        allUsers = await res.json();
        renderUsers(allUsers);
    } catch(e) {}
}

function renderUsers(users) {
    const tbody = document.getElementById('usersTable');
    tbody.innerHTML = '';
    users.forEach(u => {
        const avHtml = u.avatar
            ? `<img src="${u.avatar}" alt="${u.username}"/>`
            : u.username[0].toUpperCase();
        const date = new Date(u.createdAt).toLocaleDateString('ru');
        tbody.innerHTML += `
        <tr>
            <td style="display:flex;align-items:center;gap:10px">
                <div class="avatar-sm">${avHtml}</div>
                <span>${u.username}</span>
            </td>
            <td><span class="role-badge role-${u.role}">${u.role === 'admin' ? 'Admin' : 'User'}</span></td>
            <td>${u.msgCount || 0}</td>
            <td>${date}</td>
            <td><div class="actions">
                <button class="btn btn-role" onclick="toggleRole('${u.username}','${u.role}')">${u.role === 'admin' ? '→ User' : '→ Admin'}</button>
                <button class="btn btn-del" onclick="deleteUser('${u.username}')"><i class="fa-solid fa-trash"></i></button>
            </div></td>
        </tr>`;
    });
}

function filterUsers(q) {
    renderUsers(allUsers.filter(u => u.username.toLowerCase().includes(q.toLowerCase())));
}

async function deleteUser(username) {
    if (!confirm(`"${username}"-ро ҳазф кунем?`)) return;
    try {
        await fetch(`/api/admin/users/${username}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + adminToken }
        });
        showToast('✅ Корбар ҳазф шуд');
        loadUsers(); loadStats();
    } catch(e) { showToast('❌ Хатогӣ!'); }
}

async function toggleRole(username, currentRole) {
    const newRole = currentRole === 'admin' ? 'user' : 'admin';
    if (!confirm(`"${username}"-ро ба ${newRole} иваз кунем?`)) return;
    try {
        await fetch(`/api/admin/users/${username}/role`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminToken },
            body: JSON.stringify({ role: newRole })
        });
        showToast('✅ Нақш иваз шуд');
        loadUsers();
    } catch(e) { showToast('❌ Хатогӣ!'); }
}

function adminLogout() {
    adminToken = null;
    localStorage.removeItem('adminToken');
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('mainPanel').style.display = 'none';
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}
</script>
</body>
</html>
